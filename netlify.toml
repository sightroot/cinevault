[build]
  command = "npm install"
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "storage-access=*, fullscreen=*"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
